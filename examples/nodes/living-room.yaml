# Per-node override — copy to configs/nodes/<node_id>.yaml (filename = the node_id).
# Only the keys that differ from the node defaults; omit the rest. Edited live from
# the dashboard once the node connects. See src/kenzy/data/configs/node.yaml for all keys.

# Room's display name (shown throughout the dashboard).
room_id: "Living Room"

# Audio hardware. Set audio_device to your mic/speaker (kenzy-devices lists them);
# set the rates to the device's native rate if it doesn't do 16k/24k (resampled).
# audio_device: "Anker PowerConf S330"
# capture_sample_rate: 48000
# playback_sample_rate: 48000

# Wake word
wakeword_threshold: 0.5          # 0–1; lower = more sensitive
wakeword_vad_threshold: 0.5      # 0 disables; ~0.5 suppresses near-silence false fires

# Capture / VAD (defaults are usually fine)
# silence_rms_threshold: 150
# speech_min_ms: 400
