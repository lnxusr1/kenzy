site_name: KENZY
site_description: Distributed home voice assistant
docs_dir: docs

theme:
  name: readthedocs

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - fenced_code
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Configuration:
    - Overview: configuration/index.md
    - Node: configuration/node.md
    - Server: configuration/server.md
    - STT: configuration/stt.md
    - TTS: configuration/tts.md
    - LLM: configuration/llm.md
    - Speaker ID: configuration/speaker.md
  - Skills:
    - Overview: skills/index.md
    - Built-in Skills: skills/builtin.md
    - Writing Skills: skills/writing-skills.md
    - Home Assistant: skills/home-assistant.md
  - Speaker Enrollment: speaker-enrollment.md
  - Deployment: deployment.md
