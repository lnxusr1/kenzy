site_name: KENZY
site_description: Distributed home voice assistant
site_url: https://docs.kenzy.ai/
#repo_url: https://github.com/lnxusr1/kenzy/
copyright: "Copyright © 2026. All rights reserved. <a href='https://kenzy.ai'>Kenzy.ai</a>"
docs_dir: docs

theme:
  name: material
  logo: img/logo-sm.png
  favicon: img/logo-sm.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    # Light (default) — petrol ink on paper, matching kenzy.ai
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  generator: false
  # Header logo/wordmark links back to the main site (nav "Home" covers the docs root).
  homepage: https://kenzy.ai
  social:
    - icon: material/home
      name: kenzy.ai — main site
      link: https://kenzy.ai
    - icon: fontawesome/brands/github
      name: Kenzy on GitHub
      link: https://github.com/lnxusr1/kenzy
    - icon: fontawesome/brands/x-twitter
      name: "@KenzyAi on X"
      link: https://x.com/KenzyAi

extra_css:
  - css/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # Cloud-vs-local setup blocks on the service pages. Setup instructions only —
  # reference material stays in normal sections, because tab content can't be
  # deep-linked and a search hit lands on the page with the wrong tab showing.
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Setup Guides:
    - Getting Started:
      - Overview: getting-started.md
      - "Part 1 — First Conversation": guides/part1-first-conversation.md
      - "Part 2 — People & Rooms": guides/part2-rooms-and-people.md
      - "Part 3 — Home Assistant Basics": guides/part3-home-assistant.md
      - "Part 4 — Home Assistant, the Works": guides/part4-ha-complete.md
  - Using Kenzy:
    - Everyday use:
      - Talking to Kenzy: talking-to-kenzy.md
      - Memory: memory.md
    - Identity & access:
      - Speaker Enrollment: speaker-enrollment.md
      - On Your Phone: phone.md
    - Operate Kenzy:
      - Dashboard: dashboard.md
      - Backup & Restore: backup-restore.md
      - Upgrading: upgrading.md
      - Troubleshooting: troubleshooting.md
  - Reference:
    - Configuration:
      - Overview: configuration/index.md
      - The Language Model: configuration/llm.md
      - Her Voice (TTS): configuration/tts.md
      - Speech Recognition (STT): configuration/stt.md
      - Node: configuration/node.md
      - Server: configuration/server.md
      - Speaker ID: configuration/speaker.md
    - Skills:
      - Overview: skills/index.md
      - Built-in Skills: skills/builtin.md
      - Writing Skills: skills/writing-skills.md
      - Home Assistant: skills/home-assistant.md
    - Integrations:
      - Home Assistant: integrations/home-assistant.md
    - Running Fully Local: fully-local.md
    - Architecture: architecture.md
    - Installation Reference: install-reference.md
    - Deployment: deployment.md
