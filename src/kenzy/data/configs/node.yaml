# Kenzy room node configuration
#
# This file is BOOTSTRAP-ONLY. A node pulls its full operational config (audio
# device, sample rates, wakeword models/threshold/VAD, sounds, VAD timing, and
# its room name) from the server on every boot, and does not initialize audio
# until that config arrives. Configure all of that from the dashboard, keyed by
# this node's node_id; the keys below are only what the node needs to start up,
# log, and reach the server.

# Logging (used immediately, before server config arrives)
# log_level controls what the node prints to its console (debug, info, warning,
# error). Also live-tunable from the dashboard. verbose: true additionally enables
# debug output from websockets/asyncio/sounddevice.
log_level: "info"
verbose: false

# WebSocket URL of the Kenzy server.
# Leave null/empty to auto-discover the server on the LAN via mDNS; set an
# explicit ws:// URL to skip discovery (e.g. across VLANs that block multicast).
server_url: null

# mDNS discovery (used only when server_url is unset)
discovery:
  enabled: true
  # Shared-secret join token; must match the server's discovery.token if set.
  # token: ""

# TLS client behavior when the server has TLS enabled (a wss:// server_url, or
# the mDNS advert says so). Default: connect encrypted but do NOT verify the
# certificate — the right posture for a self-signed home-LAN cert. Set
# tls_verify: true to require a trusted cert (system store), or point tls_ca
# at the server's cert/CA file to pin it.
# tls_verify: false
# tls_ca: ""

# Stable primary identifier for this node. Leave unset — one is generated and
# written here on first run (or assigned at install via `kenzy-init --node-id`),
# and kept across restarts. The server keys this node's config, controls, and
# room name on it.
# node_id:

# ---------------------------------------------------------------------------
# Everything below is SERVER-OWNED and normally configured from the dashboard
# (pulled on connect). Values set here act only as a pre-connect fallback for
# any key the server does not push; uncomment a key only if you need that.
# ---------------------------------------------------------------------------

# Room name (e.g. "kitchen"). Server-owned: set it from the dashboard. Falls
# back to the hostname until the server provides one.
# room_id: null

# Audio device for both capture and playback (PortAudio substring or index;
# null = system default). Example: "Anker PowerConf S330"
# audio_device: null
# capture_sample_rate: 16000      # mic open rate; resampled to 16000 internally
# playback_sample_rate: 24000     # speaker open rate; TTS (24000) resampled to it
# volume: 100                     # playback volume 0-100 (server-owned, applies live)
# sound_ready: null               # activation chime (path, or null = bundled)
# sound_waiting: null             # processing sound (path, or null = silent)
# sound_connect: connect.wav      # chime when an intercom call connects (null = off)
# sound_disconnect: disconnect.wav # chime when an intercom call ends (null = off)
# sound_ringback: ringback.wav    # loop the CALLER hears while ringing a room (null = silent)
# sound_timer: timer.wav          # tone before a timer announcement (played by the server; null = voice only)
# sound_alarm: alarm.wav          # tone before each alarm ring (played by the server; null = voice only)
# sound_error: error.wav          # spoken cue when a request fails (played by the server; null = silent)
# hardware_aec: true              # false = speaker has no echo cancellation: wake ignored during playback; intercom/alarm ring disabled
# dialog_no_speech_timeout_ms: 8000  # reply window during a held dialog (server-owned, live)
# dialog_onset_ms: 300               # sustained speech needed to start a dialog turn (live)
# dialog_onset_vad_threshold: 0.5    # Silero gate for dialog onset (live)
# wake_onset_ms: 400                 # one-breath commands: hold the ready chime this long after a wake hit; 0 = chime instantly (live)
# volume_buttons: false           # USB speakerphone volume buttons (server-owned, live; enable from the dashboard)
# volume_button_device: auto             # auto = this node's audio device; or a stable name match
# volume_button_step: 5               # volume points per press (1-20)
# wakeword_models: []             # paths to .tflite/.onnx; empty = bundled
# wakeword_threshold: 0.5         # confidence [0-1] to fire the wake word
# wakeword_vad_threshold: 0.0     # Silero VAD gate [0-1]; 0 disables
# vad_enabled: true               # false = stream until server STOP
# silence_rms_threshold: 50       # RMS below this is silence (0-32767)
# silence_ms: 400                 # consecutive silence that ends a session
# speech_min_ms: 400              # min speech before silence detection arms
# no_speech_timeout_ms: 15000     # give up if no speech after activation
# hard_cap_ms: 30000              # unconditional session length ceiling (VAD)
# log_capture_level: debug        # how deep the dashboard log viewer can see (debug/trace)
