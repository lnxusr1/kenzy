# Kenzy server configuration

# Logging level for the kenzy logger (debug, info, warning, error)
log_level: "info"

# Opt this server into experimental features that aren't ready to ship
# officially. Also switches the dashboard favicon to the experimental mark (gold
# tile, petrol K, corner badge dot) so the browser tab is tellable from
# production at a glance. Editable from the dashboard's Settings tab.
# experimental: true

# Network interface to bind (0.0.0.0 = all interfaces)
host: "0.0.0.0"

# WebSocket port
port: 8765

# Optional TLS — encrypts the node WebSocket port (wss) AND the dashboard
# (https) with one cert/key pair. Off unless both paths are set. A self-signed
# cert is fine for a home LAN: Kenzy's own clients (nodes, backend services)
# connect encrypted-but-unverified by default, so no CA install is needed
# (browsers will show a one-time certificate warning). Generate a pair with:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout kenzy.key -out kenzy.crt -subj "/CN=kenzy"
# File-managed on purpose (a bad path here could lock the dashboard out).
# tls:
#   cert: /path/to/kenzy.crt
#   key: /path/to/kenzy.key

# mDNS discovery — advertise this server as _kenzy._tcp so nodes find it without
# a hardcoded server_url. Set enabled: false on networks where you'd rather pin
# server_url on each node. `token` is the shared join secret nodes must present
# AND the bearer co-located backend services use to pull config: `kenzy-init`
# generates one here by default (and matches it in node.yaml + .env's
# KENZY_SERVICE_TOKEN). It's shown in the dashboard under Settings for copy-paste
# when adding nodes. Clear it to allow unauthenticated joins (not recommended).
discovery:
  enabled: true
  instance: "kenzy-server"
  # token: "change-me"   # set by kenzy-init; the dashboard Settings page shows it

# Config-pull: defaults pushed to every node on connect, so a node needs no
# local config file. Live-tunable keys (thresholds, VAD timing) apply
# immediately; hardware keys (audio_device, sample rates, wakeword models,
# sounds) are reported but take effect on node restart. Per-room overrides go in
# configs/nodes/<room_id>.yaml and shallow-merge over these defaults.
# Web dashboard — on by default (localhost-bound), fully interactive: the logs and
# controls sub-flags default on too (set either false to restrict). Set enabled:
# false to wire up nothing (no route, buffers, or node-side overhead). Bind to
# localhost or the LAN; do not port-forward it. Set auth_token to require a bearer
# token on mutating actions.
dashboard:
  enabled: true
  # 0.0.0.0 makes the dashboard reachable from other machines on your LAN (the
  # common headless-server case). Use 127.0.0.1 to restrict it to the server only.
  bind: "0.0.0.0"
  port: 8770
  # Browser login for mutating actions (config edits, controls). Defaults to
  # admin / password — CHANGE IT with `kenzy-passwd` (run on the server node),
  # especially with the 0.0.0.0 bind above: this is plaintext HTTP reachable by
  # anyone on your LAN. Never port-forward it to the public internet.
  auth:
    username: "admin"
    password_hash: "scrypt$16384:8:1$tI5Hed-tJCVbiLvz3n12kA$29VNd72xhZKs_H0TyxhempZRKLrn9PEABFXGHo8tlwk"
  # Optional bearer token for API/CLI clients (curl/scripts); humans use the login above.
  auth_token: null
  logs: true
  controls: true

# Config-pull defaults (see below)
node_defaults:
  wakeword_threshold: 0.5
  silence_rms_threshold: 50
  vad_enabled: true
  silence_ms: 400
  speech_min_ms: 400
  no_speech_timeout_ms: 15000
  hard_cap_ms: 30000
  # Lead-in tones for timer/alarm announcements. Played by the SERVER (prepended
  # to the spoken announcement), so changes apply live — no node restart. A bare
  # name is a bundled sound; a path is read on the server host; empty = voice only.
  sound_timer: "timer.wav"
  sound_alarm: "alarm.wav"
  # Spoken failure cue when a request can't be processed (STT/LLM/TTS failure).
  # Pre-recorded (not synthesized) so it still plays when TTS itself is down;
  # same server-side/live semantics as the tones above. Empty = stay silent.
  sound_error: "error.wav"
  # Spoken acknowledgement ("On it.") when a reply is taking a while — played
  # once if the answer hasn't started after a couple of seconds. Same
  # server-side/live semantics. Empty = never speak it.
  sound_thinking: "thinking.wav"
  # Whether this room's speaker does acoustic echo cancellation (the published
  # hardware guidance recommends AEC speakerphones). Calibration DETECTS and
  # sets this per node automatically (it plays a known sound and measures the
  # echo); set it manually only to override. False = non-AEC speaker: the room becomes
  # half-duplex: wake words are ignored while Kenzy is making sound, intercom is
  # unavailable, and alarms deliver once instead of ringing until acknowledged.
  hardware_aec: true
  # Dialog turns (multi-turn conversations): the reply window while Kenzy holds
  # the floor, and the sustained-speech onset that starts a turn (a clink or
  # cough must not). All live-applied.
  dialog_no_speech_timeout_ms: 8000
  dialog_onset_ms: 300
  dialog_onset_vad_threshold: 0.5

# kenzy-speaker service — omit or set url to null to disable
speaker:
  url: "http://127.0.0.1:8768/identify"
  timeout: 10.0
  # unknown_speaker lives in the speaker SERVICE config (speaker.yaml), not here.

# Multi-turn dialog: how many consecutive follow-up turns Kenzy will hold the
# floor for before auto-ending the exchange.
dialog:
  max_turns: 6

# Alarm ringing: how many times a firing alarm re-rings, and the gap between
# rings, before it gives up (a wake word stops it sooner).
alarm:
  ring_repeats: 10
  ring_interval: 25

# kenzy-llm service — omit or set url to null to disable
llm:
  url: "http://127.0.0.1:8766/process"
  timeout: 30.0

# kenzy-tts service — omit or set url to null to disable
tts:
  url: "http://127.0.0.1:8769/speak"
  timeout: 60.0
  # Bytes per streaming chunk delivered to the node.
  # At 24 kHz int16 mono, 4096 bytes ≈ 85 ms of audio.
  chunk_size: 4096

# kenzy-stt service — omit or set url to null to disable
stt:
  url: "http://127.0.0.1:8767/transcribe"
  timeout: 60.0

# Integrations — surface Kenzy into external systems. Opt-in; nothing is wired
# Sound library roots (4.2): HA automations / the HTTP and MQTT chime surfaces
# may name any file inside these folders (relative subpaths fine; traversal and
# absolute paths always rejected — this list IS the security boundary, which is
# why it is file-managed and not dashboard-editable). data/sounds under the
# config home is always a root (and rides backups); add more (a NAS mount, a
# shared library) here. MP3/OGG/FLAC need the sound extra: pip install kenzy[sound]
sounds:
  dirs: []

# (zero overhead) unless enabled. Requires the mqtt extra: pip install kenzy[server,mqtt]
integrations:
  # Home Assistant via MQTT Discovery: each node auto-appears in HA as a device with
  # state / last-speaker / last-heard sensors. No HA-side config or custom component.
  mqtt:
    enabled: false
    host: "127.0.0.1"
    port: 1883
    # Broker credentials come from the environment, never this file:
    #   KENZY_MQTT_USERNAME / KENZY_MQTT_PASSWORD
    base_topic: "kenzy"
    discovery_prefix: "homeassistant"   # must match HA's MQTT discovery prefix
    # Extra named chimes automations may play via the kenzy/chime topic (values
    # are WAV paths on THIS host; bundled sound names like doorbell.wav work
    # without any entry here):
    # chimes:
    #   gong: "/srv/sounds/gong.wav"
    # Accept inbound commands from HA so automations can drive Kenzy. Adds per-node
    # Trigger + Stop buttons and a Mute switch (reflects voice/dashboard mutes too),
    # and these command topics you can also publish to from automations:
    #   kenzy/<node_id>/trigger   kenzy/<node_id>/stop
    #   kenzy/<node_id>/volume    (payload 0–100)
    #   kenzy/<node_id>/mute      (payload ON/OFF)
    #   kenzy/announce            (payload = text spoken in every room)
    #   kenzy/chime               (a chime, instant/no-TTS: empty = doorbell once;
    #                              or {"sound": ..., "seconds": ..., "rooms": [...]})
    # Set false for a read-only (publish-only) integration.
    commands: true
