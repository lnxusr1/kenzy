# Kenzy STT service configuration

# Bind address — 127.0.0.1 keeps it local; use 0.0.0.0 to expose on the network
host: "127.0.0.1"

# HTTP port
port: 8767

# Log level (debug, info, warning, error)
log_level: "info"
log_capture_level: "debug"  # how deep the dashboard log viewer can see (debug/trace); set via the dashboard

# Transcription backend: "whisper" (local faster-whisper, default — nothing leaves
# the box) or "openai" (cloud; no local model, so it suits underpowered hosts, but
# every captured utterance is sent to OpenAI and OPENAI_API_KEY must be set).
provider: "whisper"

# faster-whisper model configuration (provider: whisper)
whisper:
  # Model size: tiny, base, small, medium, large-v2, large-v3
  model: "tiny"
  # Inference device: cpu or cuda
  device: "cpu"
  # Quantisation type: int8 (fastest on CPU), float16 (GPU), float32
  compute_type: "int8"
  # Language code (e.g. "en"), or omit / set to null for auto-detect
  language: "en"

# OpenAI cloud transcription (provider: openai) — reads OPENAI_API_KEY from the environment
openai:
  # Model: gpt-4o-mini-transcribe (default), gpt-4o-transcribe, or whisper-1
  model: "gpt-4o-mini-transcribe"
  # Language code (e.g. "en"), or omit / set to null for auto-detect
  language: "en"
  # HTTP timeout in seconds
  timeout: 30.0
  # On a cloud failure, silently retry with local faster-whisper (loaded on
  # first need, using the whisper: settings above). Works offline only if the
  # whisper model was previously cached; otherwise the failure surfaces as the
  # error cue.
  fallback: true

# --- Wyoming protocol listener (Home Assistant voice pipelines) -------------
# Expose this service's transcription as a Wyoming ASR provider so HA's
# Assist pipeline transcribes through Kenzy's STT (HA: Add integration →
# Wyoming Protocol, pointed at this host + port). Plain TCP, no auth — the
# listener follows the service bind (loopback unless KENZY_BIND/--listen-all
# opens the LAN). Requires: pip install wyoming
wyoming:
  enabled: false
  port: 10300
