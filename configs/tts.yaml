# Kenzy TTS service configuration

host: "127.0.0.1"
port: 8769
log_level: "info"

# ---------------------------------------------------------------------------
# Provider selection
# ---------------------------------------------------------------------------
# openai  — OpenAI TTS API (default); requires OPENAI_API_KEY in .env
# kokoro  — Local Kokoro TTS (PyTorch); requires pip install -e ".[kokoro]"
#           and: sudo apt-get install espeak-ng
provider: "openai"

# ---------------------------------------------------------------------------
# OpenAI settings  (used when provider: openai)
# ---------------------------------------------------------------------------
# API key is read from the OPENAI_API_KEY environment variable.

openai:
  # TTS model
  model: "gpt-4o-mini-tts-2025-03-20"

  # Voice persona: alloy | ash | ballad | coral | echo | fable | nova | onyx | sage | shimmer
  voice: "sage"

  # Playback speed multiplier (0.25–4.0; 1.0 = normal)
  speed: 1.0

# ---------------------------------------------------------------------------
# Kokoro settings  (used when provider: kokoro)
# ---------------------------------------------------------------------------
# Run kenzy-setup after changing these to pre-download the model weights.
# Note: voice_prompt style instructions from the LLM are not supported by
# Kokoro and will be silently ignored.

kokoro:
  # Voice name — prefix determines language:
  #   af_ / am_  →  American English   (lang_code: a)
  #   bf_ / bm_  →  British English    (lang_code: b)
  # Examples: af_heart, af_bella, am_adam, bf_emma, bm_lewis
  voice: "af_heart"

  # Inference device: auto | cpu | cuda | mps
  #   auto  — picks cuda → mps → cpu at startup (recommended)
  #   cuda  — NVIDIA GPU (also covers AMD ROCm with the ROCm PyTorch build)
  #   mps   — Apple Silicon GPU (M1/M2/M3/M4)
  #   cpu   — always use CPU
  device: "auto"

  # Playback speed multiplier (0.5–2.0; 1.0 = normal)
  speed: 1.0

  # Language code — derived automatically from the first character of the
  # voice name if omitted (af_heart → 'a', bf_emma → 'b').
  # lang_code: "a"
