# Central, dashboard-managed TTS service config (was configs/hosts/office/tts.yaml).
# Deep-merged over the packaged default; seeded to the server by kenzy-deploy
# (seed-don't-clobber) and editable from the dashboard Services tab.
host: "127.0.0.1"
port: 8769
log_level: "info"

# openai | kokoro
provider: "kokoro"

openai:
  model: "gpt-4o-mini-tts-2025-03-20"
  voice: "sage"
  speed: 1.0

kokoro:
  voice: "af_heart"
  device: "auto"
  speed: 1.0
