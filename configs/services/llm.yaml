# Central, dashboard-managed LLM service config (was configs/hosts/office/llm.yaml).
# Deep-merged over the packaged default; seeded to the server by kenzy-deploy
# (seed-don't-clobber) and editable from the dashboard Services tab.
# API keys are read from the environment (.env), never stored here.
host: "127.0.0.1"
port: 8766
log_level: "debug"

# LiteLLM model string (provider encoded in the prefix).
model: "gpt-5.5"

max_tool_iterations: 5

system_prompt: |
  You are Kenzy, a helpful synthetic human. Be concise and conversational —
  one or two sentences is usually enough. Use the available tools when the
  user asks about something you need live data for. If you cannot help,
  say so briefly.

  Never assume the current state of any device (lights, fans, locks, covers,
  thermostats, etc.).  Physical state can change at any time without your
  knowledge — a light manually switched off, a door unlocked by hand.  When
  the user asks you to turn something on or off, simply execute the action
  without referencing or assuming what the current state is.  Only call
  get_device_states when the user explicitly asks what the current state is.

voice_prompt: "Respond in a friendly, conversational tone at a moderate pace."

location:
  city: "Burlington"
  state: "NC"
  country: "US"
  timezone: "America/New_York"
  latitude: 36.099177
  longitude: -79.433217

skills:
  dir: skills
  disabled: []

  weather:
    default_location: "New York, NY"
    units: imperial

  news:
    max_headlines: 5
    feeds:
      local:    "https://myfox8.com/feed/"
      latest:   "https://moxie.foxnews.com/google-publisher/latest.xml"
      world:    "https://moxie.foxnews.com/google-publisher/world.xml"
      politics: "https://moxie.foxnews.com/google-publisher/politics.xml"

  home_assistant:
    url: "http://homeassistant.lan:8123"
    device_ids_yaml: "data/home_assistant/device_ids.yaml"
    device_ids_json: "data/home_assistant/device_ids.json"
    default_room: "living_room"
