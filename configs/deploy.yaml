# kenzy-deploy configuration
#
# Run from the project root:
#   kenzy-deploy init              # one-time OS setup on all hosts
#   kenzy-deploy install           # first full deployment
#   kenzy-deploy upgrade           # push an update to all hosts
#   kenzy-deploy status            # check service health
#   kenzy-deploy logs stt --host main-server
#
# Prerequisites on each remote host
#   - SSH key auth:      ssh-copy-id user@host
#   - Passwordless sudo: add "user ALL=(ALL) NOPASSWD: ALL" to /etc/sudoers

# Install mode (top-level default; override per host, or with CLI flags):
#   source  – rsync this checkout to each host and `pip install -e` (default).
#   pypi    – install `kenzy[extras]` from PyPI; only configs/ + sync paths are
#             pushed. Use `version:` to pin (else the latest >=3 is used).
# CLI overrides: `--local` forces source everywhere; `--version X` overrides the pin.
install_mode: source
# version: 3.1.0          # pypi mode only; omit for the latest 3.x

defaults:
  ssh_user:     pi
  install_path: /opt/kenzy
  # venv_path defaults to {install_path}/.venv if omitted
  python_bin:   python3   # must be 3.11+ ; use python3.11 on Bullseye
  # Files/dirs synced to every host on install/upgrade.
  # Paths are relative to the project root.  Both files and directories work.
  sync:
    - .env

# Extra directories synced per service, in addition to the main source tree.
# skills/, data/, and models/ are excluded from the base rsync and only sent
# to hosts that need them.  Add or remove entries here to change the mapping.
# Per-host 'sync' lists (see hosts below) are merged in after these.
service_sync:
  llm:     [skills, data/home_assistant]
  speaker: [data/speakers]

# Config: central (dashboard-managed) vs per-host overlay
# -------------------------------------------------------
# Kenzy's config is server-owned and editable live from the dashboard. kenzy-deploy
# provisions into that model:
#   - Backend services (stt/tts/llm/speaker) run in PULL MODE — their units are
#     arg-less, so they fetch their effective config from the server and stay
#     dashboard-managed. (They need KENZY_SERVICE_TOKEN, + mDNS or KENZY_SERVER_URL,
#     in each host's .env to reach the server.)
#   - Nodes pull too. Set a per-host `node_id:` slug (below) to give a node a
#     stable, readable central record at configs/nodes/<node_id>.yaml; omit it and
#     the node self-generates a uuid (still dashboard-managed, just opaque).
#   - Author the central store as files in:
#       configs/nodes/<node_id>.yaml      (per node, operational config)
#       configs/services/<service>.yaml   (per backend service)
#     These are SEEDED to the server with --ignore-existing (seed-don't-clobber):
#     a re-deploy never overwrites a dashboard edit. Use `kenzy-deploy --reseed
#     install|upgrade` to force the operator's values back.
#
# Legacy per-host overlay (still supported): create configs/hosts/<host-name>/ and
# place complete config files there; they're rsynced into {install_path}/configs/
# on that host only. Prefer the central nodes/ + services/ store above for anything
# you want to manage from the dashboard.

hosts:
  # Example: this machine — no SSH needed, commands run directly
  local-server:
    address:  127.0.0.1
    local:    true
    ssh_user: ubuntu          # used as the systemd service User even locally
    services: [server, stt, tts, llm]

  # Example: room node (Pi Zero 2 W or similar). The node_id slug keys its central
  # config — author configs/nodes/living-room.yaml to set tuning; the room NAME is
  # set later from the dashboard. Omit node_id to let the node generate a uuid.
  living-room:
    address:  192.168.1.10
    services: [node]
    node_id:  living-room

  # Example: dedicated speaker-ID box (GPU optional)
  speaker-box:
    address:  192.168.1.30
    services: [speaker]
    # sync: [some/extra/path]   # optional host-specific additions
    # torch_index_url: "https://download.pytorch.org/whl/cu124"
    # ^ Set this if pip installs a torch wheel that doesn't match the host's
    #   CUDA version (symptom: libcudart.so.XX not found at startup).
    #   Run 'nvidia-smi' on the host to find the CUDA version, then pick:
    #     cu118  cu121  cu124  (CUDA 11.8 / 12.1 / 12.4)
    #     cpu    (no GPU)
    #   Can also be set under 'defaults' to apply to all hosts.
    # pip_packages:
    #   - "transformers<4.49"
    # ^ Extra pip installs applied after the main install/upgrade, useful for
    #   host-specific version pins (e.g. older GPU that requires an older
    #   transformers because torch 2.7+ cu124 builds are unavailable).
