[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kenzy"
version = "6.0.1"
description = "Distributed home voice-assistant: kenzy-node, kenzy-server, kenzy-stt, kenzy-tts, kenzy-llm, kenzy-speaker"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "lnxusr1" }]
keywords = [
    "voice-assistant",
    "home-automation",
    "speech-recognition",
    "text-to-speech",
    "llm",
    "wakeword",
    "raspberry-pi",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core dependencies shared by both node and server
dependencies = [
    "websockets>=12.0",
    "PyYAML>=6.0",
    # Split at 3.12, and BOTH sides are forced — neither is a preference.
    #
    # <=3.11 must stay on numpy 1.x because that is where the tflite wake-word
    # path lives, and `tflite-runtime` is a C extension compiled against NumPy
    # 1.x that has never been rebuilt for 2.x. Under numpy 2 it does not warn,
    # it fails the model load outright ("a module compiled using NumPy 1.x
    # cannot be run in NumPy 2.x"). That is the majority of the fleet.
    #
    # >=3.12 must be on numpy 2.x because tflite-runtime publishes no wheel
    # past cp311, so those hosts take the ONNX path — and current scipy, which
    # openwakeword needs, REQUIRES numpy>=2 at runtime and dies on np.long
    # without it.
    #
    # The ceiling carried no rationale from v3.0.0 until 2026-08-09, which cost
    # several rounds of chasing: it was believed to be one deployment's ancient
    # CUDA chain (true, and separately pinned in that host's constraints.txt),
    # and removing it on that basis immediately broke every tflite host.
    "numpy>=1.26,<2.0; python_version < '3.12'",
    "numpy>=2.1; python_version >= '3.12'",
]

[project.optional-dependencies]
# Install on the room node (Pi Zero 2 W or similar).
# NB: the wake-word engine is a SEPARATE extra — install `kenzy[node,wakeword]`
# for a working node. See the `wakeword` extra below for why it is split out.
node = [
    "sounddevice>=0.4.6",
    "zeroconf>=0.130",
]

# The wake-word engine. Split out of `node` because openwakeword declares
# tflite-runtime as a HARD dependency on Linux, and that package publishes no
# wheel past cp311 and no sdist — so `pip install kenzy[node]` simply failed on
# Python 3.12+, inside a transitive dependency, naming neither Kenzy nor the
# wake word. openwakeword's own code imports tflite lazily and only errors if
# you hand it a .tflite model, so on 3.12+ the installer installs it with
# --no-deps plus its real requirements and Kenzy falls back to the bundled ONNX
# model automatically (see node/client.py:_bundled_model_paths). Keeping it in
# `node` would make that impossible: pip re-resolves an installed package's
# declared requirements, so no install ordering can dodge it.
wakeword = [
    "openwakeword>=0.6.0",
]

# Speakerphone volume buttons (5.0.4). Deliberately NOT in the node extra:
# evdev is a C extension (needs python3-dev + gcc to build), and a normal node
# that never opts in must not grow a build-time dependency — an upgrade on a
# tool-less Pi would fail outright. The feature detects its absence and says so.
mediakeys = [
    "evdev>=1.6; platform_system == 'Linux'",
]

# Install on the server host
server = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.130",
]

# Install on the STT service host
stt = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "faster-whisper>=1.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.130",
    "wyoming>=1.6.0",
]

# Install on the TTS service host
tts = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.130",
    "wyoming>=1.6.0",
]

# Install on the S2S conversation-engine host (the v6 Realtime-shaped engine;
# websockets rides the core deps — these are the stage-adapter + boot extras)
s2s = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.130",
]

# Install on the speaker identification host
speaker = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "speechbrain>=1.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "sounddevice>=0.4.6",
    "httpx>=0.27.0",
    "zeroconf>=0.130",
]

# Install on the LLM service host
llm = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "litellm>=1.0.0",
    "httpx>=0.27.0",
    "cryptography>=41.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.0",
    "feedparser>=6.0.0",
    "trafilatura>=1.6.0",
    "ddgs>=9.0.0",
    "padacioso>=1.0.0",
    "rapidfuzz>=3.0.0",
    "zeroconf>=0.130",
]

# Local TTS using Kokoro (PyTorch) — also requires: sudo apt-get install espeak-ng
sound = [
    "av>=10.0",  # MP3/OGG/FLAC decode for the sound system (server-side)
]
kokoro = [
    # Kokoro publishes nothing for 3.13+, and a hard requirement here fails the
    # ENTIRE install for anyone picking the local voice on a current distro —
    # Debian 13 ships 3.13. The marker lets the extra resolve; both kokoro
    # imports are already lazy behind ImportError, so the tts service falls
    # back to its cloud provider instead of the host failing to install.
    # install.sh says so out loud at install time: silently not installing the
    # thing someone asked for would be worse than the failure it replaces.
    "kokoro>=0.9.0; python_version < '3.13'",
    "torch>=2.0.0",
]

# Home Assistant / MQTT integration on the server host (install kenzy[server,mqtt]).
# Publishes node state/events via HA MQTT Discovery; opt-in via integrations.mqtt.
mqtt = [
    "aiomqtt>=2.0.0",
]

# Dev / test tooling
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
kenzy-deploy  = "kenzy.deploy.deploy:main"
kenzy-node    = "kenzy.node.client:main"
kenzy-devices = "kenzy.node.devices:main"
kenzy-server  = "kenzy.server.server:main"
kenzy-stt     = "kenzy.stt.stt:main"
kenzy-tts     = "kenzy.tts.tts:main"
kenzy-llm     = "kenzy.llm.llm:main"
kenzy-s2s     = "kenzy.s2s.service:main"
kenzy-ha-devices = "kenzy.llm.ha_devices:main"
kenzy-speaker = "kenzy.speaker.speaker:main"
kenzy-enroll  = "kenzy.speaker.enroll:main"
kenzy-passwd  = "kenzy.passwd:main"
kenzy-setup   = "kenzy.setup:main"
kenzy-init    = "kenzy.init:main"

[project.urls]
Homepage = "https://kenzy.ai"
Documentation = "https://docs.kenzy.ai"
Repository = "https://github.com/lnxusr1/kenzy"
Changelog = "https://github.com/lnxusr1/kenzy/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kenzy" = [
    "data/configs/*.yaml",
    "data/.env.example",
    # Ships type information to plugin repos (kenzy-ld2450 mypy-checks against
    # the real kenzy types; without this marker they see Any). 5.1.
    "py.typed",
]
"kenzy.node" = [
    "models/*.tflite",
    # An ONNX copy of the wake-word model, for hosts with no tflite runtime
    # (macOS, and any Python past 3.11). Optional: _bundled_model_paths picks
    # whichever format the host can actually run.
    "models/*.onnx",
    "sounds/*.wav",
]
"kenzy.server" = [
    "dashboard_static/*",
    "dashboard_static/**/*",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
# Built-in skills are author-facing example code (like user overlay skills); they
# are bundled in the package but kept out of the strict lint/type gate.
extend-exclude = ["src/kenzy/llm/builtin_skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict         = true
mypy_path      = "src"
# strict enables warn_unused_ignores, but the `# type: ignore[import-untyped]`
# comments on optional third-party imports (sounddevice, torch, litellm, yaml …)
# are needed or not depending on which extras are installed and the mypy version.
# Keep the protective ignores; don't fail when a given environment doesn't need one.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "kenzy.llm.builtin_skills.*"
ignore_errors = true
