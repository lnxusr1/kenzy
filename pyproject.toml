[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kenzy"
version = "3.2.1"
description = "Distributed home voice-assistant: kenzy-node, kenzy-server, kenzy-stt, kenzy-tts, kenzy-llm, kenzy-speaker"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "lnxusr1" }]
keywords = [
    "voice-assistant",
    "home-automation",
    "speech-recognition",
    "text-to-speech",
    "llm",
    "wakeword",
    "raspberry-pi",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core dependencies shared by both node and server
dependencies = [
    "websockets>=12.0",
    "PyYAML>=6.0",
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
# Install on the room node (Pi Zero 2 W or similar)
node = [
    "sounddevice>=0.4.6",
    "openwakeword>=0.6.0",
    "zeroconf>=0.130",
]

# Install on the server host
server = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.130",
]

# Install on the STT service host
stt = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "faster-whisper>=1.0.0",
    "zeroconf>=0.130",
]

# Install on the TTS service host
tts = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.130",
]

# Install on the speaker identification host
speaker = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "speechbrain>=1.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "sounddevice>=0.4.6",
    "httpx>=0.27.0",
    "zeroconf>=0.130",
]

# Install on the LLM service host
llm = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "litellm>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.0",
    "feedparser>=6.0.0",
    "trafilatura>=1.6.0",
    "padacioso>=1.0.0",
    "rapidfuzz>=3.0.0",
    "zeroconf>=0.130",
]

# Local TTS using Kokoro (PyTorch) — also requires: sudo apt-get install espeak-ng
kokoro = [
    "kokoro>=0.9.0",
    "torch>=2.0.0",
]

# Dev / test tooling
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
kenzy-deploy  = "kenzy.deploy.deploy:main"
kenzy-node    = "kenzy.node.client:main"
kenzy-devices = "kenzy.node.devices:main"
kenzy-server  = "kenzy.server.server:main"
kenzy-stt     = "kenzy.stt.stt:main"
kenzy-tts     = "kenzy.tts.tts:main"
kenzy-llm     = "kenzy.llm.llm:main"
kenzy-ha-devices = "kenzy.llm.ha_devices:main"
kenzy-speaker = "kenzy.speaker.speaker:main"
kenzy-enroll  = "kenzy.speaker.enroll:main"
kenzy-passwd  = "kenzy.passwd:main"
kenzy-setup   = "kenzy.setup:main"
kenzy-init    = "kenzy.init:main"

[project.urls]
Homepage = "https://kenzy.dev"
Documentation = "https://docs.kenzy.dev"
Repository = "https://github.com/lnxusr1/kenzy"
Changelog = "https://github.com/lnxusr1/kenzy/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kenzy" = [
    "data/configs/*.yaml",
    "data/.env.example",
]
"kenzy.node" = [
    "models/*.tflite",
    "sounds/*.wav",
]
"kenzy.server" = [
    "dashboard_static/*",
    "dashboard_static/**/*",
]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
# Built-in skills are author-facing example code (like user overlay skills); they
# are bundled in the package but kept out of the strict lint/type gate.
extend-exclude = ["src/kenzy/llm/builtin_skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict         = true
mypy_path      = "src"
# strict enables warn_unused_ignores, but the `# type: ignore[import-untyped]`
# comments on optional third-party imports (sounddevice, torch, litellm, yaml …)
# are needed or not depending on which extras are installed and the mypy version.
# Keep the protective ignores; don't fail when a given environment doesn't need one.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "kenzy.llm.builtin_skills.*"
ignore_errors = true
